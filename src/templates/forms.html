.doc .hd.hdst-2{background:#1a1a1a;border-bottom:none;border-radius:4px;padding:9px 14px 9px;}.doc .hd.hdst-2 .hd-dept,.doc .hd.hdst-2 .hd-date-val{color:#fff;}.doc .hd.hdst-2 .hd-company,.doc .hd.hdst-2 .hd-docno{color:#bdbdbd;}.doc .hd.hdst-2 .hd-logo{background:#fff;border-radius:4px;padding:2px;}.a4-foot-wrap .pp-foot.hdst-2{background:#f2f2f2;border-top:2px solid #1a1a1a;padding:6px 12px;}.doc .hd.hdst-3{border-bottom:1px solid #d0d0d0;}.doc .hd.hdst-3 .hd-logo-wrap{order:-1;flex:0 0 auto;}.doc .hd.hdst-3 .hd-row .hd-dept-wrap{flex:0 0 auto;}.doc .hd.hdst-3 .hd-row .hd-date{flex:1 1 0;min-width:0;display:block;text-align:left;}.doc .hd.hdst-3 .hd-logo{width:34px;height:34px;}.doc .hd.hdst-3 .hd-dept{white-space:nowrap;}.a4-foot-wrap .pp-foot.hdst-3{border-top:1px solid #d0d0d0;justify-content:center;gap:18px;}.doc .hd.hdst-4{border-bottom:3px double #1a1a1a;}.doc .hd.hdst-4 .hd-row{display:block;text-align:center;}.doc .hd.hdst-4 .hd-logo-wrap{display:block;margin-bottom:2px;}.doc .hd.hdst-4 .hd-dept-wrap{display:block;text-align:center;}.doc .hd.hdst-4 .hd-dept,.doc .hd.hdst-4 .hd-company{text-align:center;}.doc .hd.hdst-4 .hd-date{display:flex;flex-direction:row;justify-content:space-between;align-items:center;width:100%;margin-top:6px;}.a4-foot-wrap .pp-foot.hdst-4{border-top:3px double #1a1a1a;display:block;text-align:center;}.doc .hd.hdst-5{border-bottom:1px solid #e3e3e3;}.doc .hd.hdst-5 .hd-row{border-right:4px solid #1a1a1a;padding-right:11px;border-radius:2px;}.a4-foot-wrap .pp-foot.hdst-5{border-top:1px solid #e3e3e3;border-right:4px solid #1a1a1a;padding-right:11px;}
#formFill .a4-sheet{background:#fff;color:#1a1a1a;}
#formFill .a4-sheet .doc{max-width:none;}
.dwrap{position:relative;display:block;width:100%;}
.dwrap.hd-dwrap{display:inline-block;width:auto;}
.hd-date-inp{width:auto;min-width:150px;}
/* leave the right edge clear so the browser's calendar icon is never covered */
.dhint{position:absolute;top:0;bottom:0;left:0;right:24px;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:.78rem;color:#a2a2a2;white-space:nowrap;}
.doc-date-inp.has-val ~ .dhint,.doc-date-inp:focus ~ .dhint{display:none;}
.doc-date-inp:not(.has-val):not(:focus)::-webkit-datetime-edit{opacity:0;}
.doc-date-inp:not(.has-val):not(:focus)::-moz-datetime-edit{opacity:0;}
.doc .line-txt{font-size:.86rem;line-height:2.1;margin:8px 0;font-weight:700;}
.doc .line-txt .line-inp{display:inline-block;min-width:260px;border-bottom:1px dashed #bdbdbd;vertical-align:baseline;}
.doc .line-txt .line-inp .doc-inp{text-align:right;padding:2px 4px;font-weight:700;}
.doc .line-txt .line-inp .empbox{display:inline-block;width:100%;}
.doc .fixed-txt{font-size:.82rem;line-height:1.95;text-align:justify;margin:10px 0;font-weight:700;}
.doc .fixed-txt .fx-sp{height:8px;}
.a4-foot-wrap{position:absolute;}
.a4-foot-wrap .pp-foot{border-top:2px solid #1a1a1a;padding-top:4px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.a4-foot-wrap .pp-foot-addr,.a4-foot-wrap .pp-foot-contact{font-size:9px;color:#8a8a8a;line-height:1.5;white-space:nowrap;}
.a4-foot-wrap .pp-foot-contact{direction:ltr;letter-spacing:.2px;}
.a4-num{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-size:11px;color:#9a9a9a;}
.pg-opts{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:0 auto 16px;max-width:760px;background:var(--bg);}
.pg-opts-t{font-size:.85rem;font-weight:700;margin-bottom:10px;color:var(--text);}
.pg-opts-g{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px;}
.pg-o{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--text2);border:1px solid var(--border2);border-radius:8px;padding:5px 9px;}
.pg-o-sel select{height:28px;border:1px solid var(--border2);border-radius:6px;background:transparent;color:var(--text);font-family:inherit;font-size:.78rem;padding:0 6px;}
.pg-o input{width:56px;height:28px;border:1px solid var(--border2);border-radius:6px;background:transparent;color:var(--text);font-family:inherit;font-size:.8rem;text-align:center;}
.pg-o em{font-style:normal;color:var(--text3);font-size:.72rem;}

/* toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--text);color:var(--bg);border-radius:var(--rp);padding:10px 20px;font-size:.82rem;font-weight:400;box-shadow:var(--sh2);z-index:900;opacity:0;pointer-events:none;white-space:nowrap;transition:transform .34s cubic-bezier(.16,1,.3,1),opacity .26s ease;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

/* settings */
.set-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:26px;max-width:480px;}
.set-card h3{font-size:1rem;font-weight:500;margin-bottom:20px;}

.section{display:none;}.section.active{display:block;}

/* ── ON-SCREEN DOCUMENT PREVIEW (mirrors print) ── */
.doc{background:#fff;color:#000;border:1px solid #e0e0e0;border-radius:10px;padding:34px 38px;direction:rtl;font-family:'TSans-Light','Noto Naskh Arabic',sans-serif;font-size:.92rem;line-height:1.65;}
.doc .hd{display:flex;align-items:center;gap:14px;border-bottom:2px solid #1a1a1a;padding-bottom:12px;margin-bottom:6px;}
.doc .hd-centered{display:block;}
.doc .hd-logo-wrap{text-align:center;}
.doc .hd-logo-wrap .hd-logo{display:inline-block;width:60px;height:60px;object-fit:contain;}
.doc .hd-row{display:flex;align-items:center;justify-content:space-between;gap:14px;}
.doc .hd-row .hd-dept-wrap{flex:1;}
.doc .hd-row .hd-date{flex:1;}
.doc .hd-logo{width:44px;height:44px;object-fit:contain;}
.doc .hd-dept{font-size:.92rem;font-weight:700;color:#1a1a1a;}
.doc .hd-company{font-size:.66rem;font-weight:400;color:#777;margin-top:1px;}
.doc .hd-dept-wrap{display:flex;flex-direction:column;}
.doc .hd-date{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:left;}
.doc .hd-date-val{font-size:.86rem;font-weight:700;color:#1a1a1a;letter-spacing:.3px;direction:ltr;}
.doc .hd-docno{font-size:.72rem;font-weight:600;color:#777;direction:ltr;letter-spacing:.5px;}
.doc .doc-title{text-align:center;margin:16px 0 16px;}
.doc .doc-title h1{font-size:1.25rem;font-weight:700;margin:0;color:#1a1a1a;letter-spacing:.2px;}
.doc .sec-h{background:#f0f0f0;color:#1a1a1a;padding:5px 11px;font-size:.8rem;font-weight:700;margin:12px 0 0;border:1px solid #cfcfcf;border-bottom:none;border-radius:5px 5px 0 0;text-align:center;}
.doc table{width:100%;border-collapse:collapse;margin-bottom:8px;table-layout:fixed;}
.doc table.bord td,.doc table.bord th{border:1px solid #cfcfcf;}
.doc th{background:#f0f0f0;color:#1a1a1a;padding:6px 9px;text-align:center;font-size:.76rem;font-weight:700;border:1px solid #cfcfcf;}
.doc td{padding:6px 9px;vertical-align:top;font-size:.81rem;text-align:center;word-wrap:break-word;overflow-wrap:break-word;}
.doc td.lbl{background:#f7f7f7;font-weight:700;width:17.5%;color:#222;text-align:center;}
.doc col.c-l{width:17.5%;}
.doc col.c-v{width:32.5%;}
.doc .pledge{background:#f9f9f9;border:1px solid #cfcfcf;padding:9px 12px;font-size:.8rem;line-height:1.8;border-radius:6px;margin-bottom:9px;text-align:justify;}
.doc .clause-box{border:1px solid #c8c8c8;border-radius:5px;margin:7px 0;overflow:hidden;page-break-inside:avoid;break-inside:avoid;}
.doc .clause-h{background:#f0f0f0;padding:5px 11px;font-size:.79rem;font-weight:700;border-bottom:1px solid #c8c8c8;}
.doc .clause-b{padding:7px 11px;font-size:.78rem;line-height:1.75;}
.clause-ed{border:1px solid var(--line,#d8d8d8);border-radius:8px;margin:10px 0;overflow:hidden;}
.clause-ed.is-hidden{opacity:.4;}
.clause-ed-h{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f0f0f0;padding:5px 10px;border-bottom:1px solid #d8d8d8;}
.clause-ed-t{font-size:.85rem;font-weight:700;}
.clause-ed-tools{display:flex;align-items:center;gap:4px;}
.clause-ed-b{min-height:52px;padding:9px 12px;line-height:1.9;text-align:justify;outline:none;}
.word-btn{background:#fff;border:1px solid #cfcfcf;border-radius:6px;padding:3px 10px;font-size:.72rem;font-weight:600;font-family:inherit;color:#444;cursor:pointer;line-height:1.6;transition:all .15s;}
.word-btn:hover{border-color:#222;color:#000;background:#f5f5f5;}
.del-btn{color:#b3261e;border-color:#e6bdb9;}
.del-btn:hover{color:#fff;background:#b3261e;border-color:#b3261e;}
.btn-add-clause{width:100%;justify-content:center;margin-top:2px;}
.clause-ed-t[contenteditable]{outline:none;border-bottom:1px dashed #b0b0b0;min-width:60px;}
.eye-btn{background:none;border:none;cursor:pointer;padding:2px 4px;display:flex;align-items:center;color:inherit;}
.eye-btn svg{width:16px;height:16px;}
.doc .sig-s{margin-top:30px;padding-top:8px;display:flex;gap:40px;flex-wrap:wrap;}
.doc .sig-b{min-width:150px;flex:1;text-align:center;}
.doc .sig-l{font-size:.84rem;font-weight:700;margin-bottom:38px;}
/* ── WYSIWYG EDITABLE DOCUMENT (fill view mirrors print) ── */
.doc-edit{max-width:780px;margin:0 auto;}
.doc-edit .hd-date .doc-inp{border:none;background:transparent;font-size:.82rem;font-weight:700;text-align:left;width:120px;padding:2px 4px;}
.doc-edit .sec-h{cursor:default;}
.doc-edit td{padding:0;vertical-align:middle;}
.doc-edit td.lbl{padding:0;}
.lblcell{display:flex;align-items:center;justify-content:center;gap:6px;padding:5px 8px;min-height:34px;}
.lblcell.is-hidden .lblcell-txt{text-decoration:line-through;color:#aaa;}
.lblcell-txt{font-size:.82rem;font-weight:700;color:#222;cursor:text;border-bottom:1px dashed transparent;}
.lblcell-txt:hover{border-bottom-color:#bbb;}
.lblcell-eye{width:22px;height:22px;border-radius:5px;border:1px solid #d8d8d8;background:#fff;color:#999;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;}
.lblcell-eye:hover{color:#222;border-color:#222;}
.lblcell-eye svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.valcell.is-hidden{opacity:.4;}
.doc-inp{width:100%;border:none;background:transparent;font-family:inherit;font-size:.86rem;color:#000;outline:none;text-align:center;padding:7px 8px;direction:rtl;}
.doc-inp:focus{background:#f4f7ff;}
.doc-inp.doc-ta{text-align:right;line-height:1.7;resize:vertical;min-height:46px;padding:7px 10px;}
select.doc-inp{cursor:pointer;}
.fld-lbl-edit{font-size:.82rem;padding:3px 8px;border:1px solid #222;border-radius:5px;background:#fff;color:#000;outline:none;direction:rtl;font-family:inherit;text-align:center;max-width:90%;}
.btn-add-field{margin:6px 0 4px;font-size:.78rem;font-weight:500;color:#444;background:transparent;border:1px dashed #c8c8c8;border-radius:8px;padding:8px 12px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:all .15s;}
.btn-add-field:hover{border-color:#222;color:#000;background:#f7f7f7;}
.btn-add-field svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;}
.doc-checks{border:1px solid #cfcfcf;border-top:none;padding:10px 14px;}
.doc-checks .dc-lbl{font-size:.82rem;font-weight:700;margin-bottom:8px;color:#222;}
.doc-edit .checks{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;}
.doc-edit .check{font-size:.84rem;color:#222;}
.sig-editor-wrap{border:1px solid #cfcfcf;border-top:none;padding:12px 14px;margin-bottom:4px;}
.doc-edit .items-tbl td{padding:0;}
.doc-edit .items-tbl td input,.doc-edit .items-tbl td select{width:100%;border:none;background:transparent;padding:7px 8px;font-size:.84rem;color:#000;outline:none;direction:rtl;text-align:center;font-family:inherit;}
.doc-edit .items-tbl td input:focus{background:#f4f7ff;}
.doc-edit .del-row{cursor:pointer;color:#aaa;text-align:center;}
.doc-edit .del-row:hover{color:#c0392b;}
/* editable header + manual select + font picker */
.doc-edit .dept-edit{border:none;background:transparent;font-family:inherit;font-size:.98rem;font-weight:700;color:#1a1a1a;outline:none;direction:rtl;padding:2px 4px;width:auto;max-width:240px;border-bottom:1px dashed transparent;}
.doc-edit .dept-edit:hover{border-bottom-color:#bbb;} .doc-edit .dept-edit:focus{border-bottom-color:#222;background:#f4f7ff;}
.doc-edit .title-edit{border:none;background:transparent;font-family:inherit;font-size:1.3rem;font-weight:700;color:#1a1a1a;outline:none;direction:rtl;text-align:center;width:100%;padding:4px;border-bottom:1px dashed transparent;}
.doc-edit .title-edit:hover{border-bottom-color:#bbb;} .doc-edit .title-edit:focus{border-bottom-color:#222;background:#f4f7ff;}
.doc-edit .doc-manual{margin-top:4px;border:1px solid #c8c8c8;border-radius:6px;text-align:center;}
.font-picker-wrap{display:flex;align-items:center;gap:8px;}
.font-picker-wrap label{font-size:.72rem;color:var(--text3);font-weight:500;white-space:nowrap;}
.font-picker{height:34px;padding:0 10px;border:1px solid var(--border2);border-radius:var(--r);background:var(--inp);color:var(--text);font-size:.8rem;font-family:var(--ff);outline:none;cursor:pointer;max-width:200px;}
.font-picker:focus{border-color:var(--text);}
/* signature editor (in form) */
.sig-edit-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.sig-edit-num{width:24px;height:24px;flex-shrink:0;border-radius:6px;background:var(--bg2);color:var(--text3);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:600;border:1px solid var(--border);}
.sig-edit-inp{flex:1;height:38px;padding:0 12px;background:var(--inp);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:.84rem;outline:none;direction:rtl;font-family:var(--ff);transition:border-color var(--t);}
.sig-edit-inp:focus{border-color:var(--text);}
.sig-edit-del{width:34px;height:34px;flex-shrink:0;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--t);}
.sig-edit-del:hover{color:var(--text);border-color:var(--text);}
.doc .foot{margin-top:20px;padding-top:10px;border-top:1px solid #e0e0e0;display:flex;justify-content:space-between;font-size:.6rem;color:#aaa;}

@media(max-width:600px){.topbar-date{display:none;}}

/* ── ARCHIVE PAGE ── */
.arch-empty{padding:48px 20px;text-align:center;color:var(--text3);font-size:.9rem;}
.arch-tbl{width:100%;border-collapse:collapse;font-size:.84rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;}
.arch-tbl th{background:var(--bg2);color:var(--text3);font-weight:500;font-size:.74rem;padding:11px 12px;text-align:right;border-bottom:1px solid var(--border);}
.arch-tbl td{padding:11px 12px;border-bottom:1px solid var(--border);color:var(--text2);}
.arch-tbl tr:last-child td{border-bottom:none;}
.arch-tbl tr:hover td{background:var(--hover);}
.arch-no{font-weight:700;color:var(--text);direction:ltr;text-align:right;}
.arch-date{font-size:.76rem;color:var(--text3);direction:ltr;text-align:right;white-space:nowrap;}
.arch-actions{display:flex;gap:6px;justify-content:flex-start;}
.arch-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--t);}
.arch-btn:hover{border-color:var(--text);color:var(--text);}
.arch-btn svg{width:15px;height:15px;}
.arch-del:hover{border-color:#c0392b;color:#c0392b;}

/* document number in printed doc */
.doc .doc-no{font-size:.72rem;color:#888;font-weight:500;margin-top:4px;direction:ltr;letter-spacing:.5px;}

/* save indicator on form page */
.save-indicator{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;color:var(--text3);opacity:0;transition:opacity .25s;white-space:nowrap;}
.save-indicator.show{opacity:1;}
.save-indicator svg{width:13px;height:13px;stroke:#1f9d57;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}

/* ── employee smart search ── */
.empbox{position:relative;width:100%;}
.empsearch{width:100%;}
.empdrop{position:absolute;top:100%;right:0;left:0;z-index:50;background:var(--surface);border:1px solid var(--border2);border-radius:9px;box-shadow:var(--sh2);max-height:240px;overflow-y:auto;margin-top:3px;}
.empopt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 11px;cursor:pointer;border-bottom:1px solid var(--border);}
.empopt:last-child{border-bottom:none;}
.empopt:hover{background:var(--blue-50,#eef2ff);background:var(--hover);}
.eo-name{font-size:.82rem;color:var(--text);font-weight:500;}
.eo-id{font-size:.72rem;color:var(--text3);direction:ltr;font-weight:600;}

/* ── draggable column resize (edit view) ── */
.doc-edit table.doc-tbl td{position:relative;}
.col-grip{position:absolute;top:0;bottom:0;left:-3px;width:7px;cursor:col-resize;z-index:5;}
.col-grip:hover{background:rgba(80,120,255,.25);}

/* ghost (secondary) button for blank-print */
.ghost-btn{height:48px;padding:0 18px;border:1.5px solid var(--blue-border);border-radius:var(--r);background:transparent;color:var(--blue);font-family:var(--ff);font-size:.9rem;font-weight:500;cursor:pointer;transition:all var(--t);}
.ghost-btn:hover{background:var(--blue-soft);}

/* ── textarea font-size tools ── */
.ta-wrap{width:100%;}
.ta-tools{display:flex;justify-content:flex-start;gap:5px;margin-bottom:4px;}
.ta-fbtn{min-width:34px;height:26px;padding:0 8px;border:1px solid var(--border2);border-radius:7px;background:var(--surface);color:var(--text2);font-family:var(--ff);font-size:.74rem;font-weight:700;cursor:pointer;transition:all var(--t);}
.ta-fbtn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft);}
.ta-wrap .doc-ta{resize:vertical;min-height:60px;}

/* ── free letter open writing area ── */
.free-tools{display:flex;align-items:center;gap:5px;margin:10px 0 6px;flex-wrap:wrap;}
.ta-sep{width:1px;height:20px;background:var(--border2);margin:0 3px;}
.ta-fbtn svg{width:15px;height:15px;display:block;}
.ta-bold b{font-family:inherit;}
.free-body{width:100%;min-height:420px;border:none;background:transparent;font-family:inherit;color:#000;outline:none;line-height:2;text-align:justify;direction:rtl;padding:6px 2px;resize:vertical;overflow:auto;}
.free-body:focus{background:rgba(80,120,255,.04);}
.free-body:empty:before{content:attr(data-ph);color:#aaa;}
.free-print{min-height:60px;line-height:1.9;padding:0 2px;margin-top:4px;}

/* preview wrapper for announcement */

/* ════════ CONTRACTS ALERT DASHBOARD ════════ */

/* ══ employee profile modal ══ */
@keyframes eppop{from{transform:translateY(10px) scale(.97);opacity:0;}to{transform:none;opacity:1;}}
.ep-close{position:absolute;top:14px;left:14px;width:32px;height:32px;border:none;border-radius:9px;background:var(--bg2);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.ep-close svg{width:17px;height:17px;}
.ep-close:hover{background:var(--red,#CC4141);color:#fff;}
.ep-head{text-align:center;padding-bottom:18px;border-bottom:1px solid var(--border);margin-bottom:4px;}
.ep-av{width:66px;height:66px;border-radius:19px;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;}
.ep-av svg{width:34px;height:34px;}
.ep-hname{font-size:1.18rem;font-weight:800;color:var(--text);line-height:1.35;}
.ep-hbadge{display:inline-block;margin-top:9px;padding:4px 14px;border-radius:20px;font-size:.76rem;font-weight:700;color:#fff;}
.ep-hbadge.c-green{background:#16a34a;}.ep-hbadge.c-yellow{background:#e0a800;}.ep-hbadge.c-red{background:#dc2626;}.ep-hbadge.c-expired{background:#7f1d1d;}.ep-hbadge.c-blue{background:#0ea5e9;}.ep-hbadge.c-gray{background:#6b7280;}.ep-hbadge.c-prob{background:#7c3aed;}
.ep-rows{padding-top:14px;display:flex;flex-direction:column;gap:2px;}
.ep-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 4px;border-bottom:1px dashed var(--border);}
.ep-row:last-child{border-bottom:none;}
.ep-lbl{font-size:.83rem;color:var(--text3);font-weight:600;flex-shrink:0;}
.ep-val{font-size:.92rem;color:var(--text);font-weight:700;text-align:left;}
.ep-comp{display:inline-block;padding:2px 10px;border-radius:8px;font-size:.72rem;font-weight:800;color:#fff;}
.ep-comp.comp-contracting{background:#b45309;}
.ep-comp.comp-trading{background:#173BD1;}
.ep-comp.comp-none{background:#6b7280;}
.ep-comp-full{display:block;font-size:.72rem;color:var(--text3);font-weight:600;margin-top:4px;}

.cc-head{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:8px;}
.cc-name{font-size:.9rem;font-weight:700;line-height:1.35;color:#fff;}
.cc-ic{width:18px;height:18px;flex-shrink:0;color:#fff;}
.cc-end{font-size:.76rem;color:#fff;opacity:.92;}
.cc-days{font-size:1.1rem;font-weight:800;margin:6px 0;color:#fff;}
.cc-days-sm{font-size:.9rem;opacity:.8;}
.cc-badge{font-size:.74rem;font-weight:700;padding:5px 8px;border-radius:8px;background:rgba(255,255,255,.22);color:#fff;}
.cc-prob{margin-top:8px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:.72rem;font-weight:700;padding:5px 8px;border-radius:8px;background:#7c3aed;color:#fff;}
.cc-prob svg{width:14px;height:14px;}
.cc-paper{margin-top:8px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:.72rem;font-weight:700;padding:5px 8px;border-radius:8px;background:rgba(0,0,0,.25);color:#fff;}
.cc-paper svg{width:14px;height:14px;}

/* طلب سلفة نقدية — توسيط كل النصوص */
.doc-cash_advance td,.doc-cash_advance th{text-align:center!important;}
.doc-cash_advance .pledge{text-align:center!important;}
.doc-cash_advance .doc-inp,.doc-cash_advance textarea.doc-inp{text-align:center!important;}




.lg-hero{flex-shrink:0;padding:clamp(24px,5.4vh,48px) 30px clamp(20px,3.4vh,34px);
  color:#fff;position:relative;z-index:2;text-align:center;transition:padding .34s cubic-bezier(.32,.72,0,1)}
.lg-drop{height:clamp(70px,10.5vh,104px);width:auto;display:block;margin:0 auto clamp(12px,2vh,20px);
  filter:drop-shadow(0 6px 22px rgba(0,0,0,.16));transition:height .34s cubic-bezier(.32,.72,0,1)}

.lg-sheet{flex:1;background:#fff;border-radius:28px 28px 0 0;position:relative;z-index:3;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -10px 40px rgba(6,16,60,.22)}
.lg-pane{position:absolute;inset:0;display:flex;flex-direction:column;
  transition:transform .38s cubic-bezier(.32,.72,0,1),opacity .26s}

.lg-row{width:100%;display:flex;align-items:center;gap:14px;padding:13px 12px;border-radius:16px;
  text-align:right;transition:background .14s;background:none;border:none;cursor:pointer;font-family:var(--ff)}
.lg-av{width:44px;height:44px;border-radius:50%;background:#EDF1FA;color:#173BD1;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:.87rem;font-weight:700;transition:all .18s;overflow:hidden}
.lg-rnm{font-size:.94rem;font-weight:500;line-height:1.42;color:#0B0E14;display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.lg-back{align-self:flex-start;display:flex;align-items:center;gap:7px;font-size:.88rem;color:#173BD1;
  font-weight:500;padding:8px 10px 8px 4px;margin:0 -4px 12px 0;border-radius:10px;
  background:none;border:none;cursor:pointer;font-family:var(--ff)}
.lg-lbl{display:block;font-size:.78rem;color:#8B93A3;font-weight:500;margin-bottom:8px;
  letter-spacing:.04em;text-align:right}
.lg-code{width:100%;height:62px;border:none;border-bottom:2px solid #D4D9E2;background:none;
  font-size:1.72rem;font-weight:500;text-align:center;letter-spacing:.55em;text-indent:.55em;
  color:#0B0E14;transition:border-color .2s;border-radius:0;padding:0 0 6px;font-family:var(--ff);
  direction:ltr}

.lg-codewrap::after{content:"";position:absolute;bottom:0;right:50%;left:50%;height:2px;background:#173BD1;
  transition:right .32s cubic-bezier(.32,.72,0,1),left .32s cubic-bezier(.32,.72,0,1)}
.lg-eye{position:absolute;bottom:12px;left:-6px;width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;color:#B3BAC7;background:none;border:none;cursor:pointer}
.lg-go{width:100%;height:56px;border-radius:16px;background:#173BD1;color:#fff;font-size:1rem;font-weight:500;
  margin-top:auto;transition:background .18s,transform .1s;display:flex;align-items:center;justify-content:center;
  gap:9px;border:none;cursor:pointer;font-family:var(--ff)}

.lg-swap{display:flex;align-items:center;gap:6px;font-size:.8rem;color:#173BD1;font-weight:500;
  padding:8px 12px;border-radius:100px;background:#F1F4FB;white-space:nowrap;border:none;cursor:pointer;font-family:var(--ff)}
.lg-grid{flex:1;overflow-y:auto;padding:0 16px calc(20px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:1fr;gap:9px;align-content:start}
.lg-card{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:#fff;
  border:1px solid #EAEDF3;text-align:right;transition:all .18s;cursor:pointer;font-family:var(--ff);width:100%}
.lg-ico{width:46px;height:46px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;color:#fff}

@media (min-width:760px){
  .lg-sheet{flex:none;width:100%;max-width:460px;height:min(478px,70vh);border-radius:26px;

    transition:max-width .4s cubic-bezier(.32,.72,0,1),height .4s cubic-bezier(.32,.72,0,1)}
}

function pasteAsText(e){
  // Insert pasted content as PLAIN TEXT so it adopts the form's font instead of the
  // source's inline styles, while preserving every character (dashes, commas, punctuation)
  // and line breaks. We rely on the browser's native insertText, which is the most
  // faithful way to inject plain text into a contenteditable region.
  e.preventDefault();
  var cd=e.clipboardData||window.clipboardData;
  if(!cd) return;
  var text=cd.getData('text/plain');
  if(text===''||text===null||text===undefined) return;
  // Normalise line endings only (no character stripping whatsoever).
  text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  // Prefer the native command: it preserves all characters and creates proper line breaks.
  var ok=false;
  try{ ok=document.execCommand('insertText',false,text); }catch(err){ ok=false; }
  if(!ok){
    // Fallback for environments where insertText is unsupported: build text nodes + <br>.
    var sel=window.getSelection&&window.getSelection();
    if(sel&&sel.rangeCount){
      var range=sel.getRangeAt(0);
      range.deleteContents();
      var lines=text.split('\n');
      var frag=document.createDocumentFragment();
      for(var i=0;i<lines.length;i++){
        frag.appendChild(document.createTextNode(lines[i]));
        if(i<lines.length-1) frag.appendChild(document.createElement('br'));
      }
      range.insertNode(frag);
      range.collapse(false);
      sel.removeAllRanges(); sel.addRange(range);
    }
  }
  if(typeof scheduleSave==='function') scheduleSave();
}

/* pre-fill fields that declare a default value (fl.def); never overwrites typed/restored data */
function prefillDefaults(f){
  function walk(arr){
    (arr||[]).forEach(function(fl){
      if(!fl || fl.def===undefined) return;
      var e=$('f_'+fl.id); if(!e) return;
      if(e.isContentEditable||e.getAttribute('contenteditable')==='true'){
        if(!e.innerHTML.trim()) e.innerHTML=fl.def;
      } else if(!e.value){
        if(e.tagName==='SELECT'){
          var hit=false;
          for(var i=0;i<e.options.length;i++){ if(e.options[i].value===fl.def||e.options[i].text===fl.def){ e.selectedIndex=i; hit=true; break; } }
          if(!hit) e.value=fl.def;
        } else e.value=fl.def;
      }

/* measure the editable document, then deal its blocks onto A4 sheets */
var _lastLayoutSig='';
function layoutSheets(){
  try{ return layoutSheetsInner(); }
  catch(e){
    /* fall back to the plain, unpaginated document rather than showing nothing */
    if(window.console&&console.error) console.error('layoutSheets failed:',e);
    var pg=$('a4Pages'), ms=$('a4Measure');
    if(pg&&ms){
      Array.prototype.forEach.call(pg.querySelectorAll('.a4-sheet > .doc > *'),function(n){ ms.appendChild(n); });
      var d=pg.querySelector('.doc'); if(d&&!ms.firstElementChild) ms.appendChild(d);
      pg.innerHTML='';
      ms.style.display='';            /* fallback view must stay visible */
    }
    var z=$('a4Zoom'); if(z){ z.style.transform=''; z.style.height=''; }
  }
}
/* height of one block including the margin separating it from the next */
function blockH(b){
  var st=window.getComputedStyle?getComputedStyle(b):null;
  return (b.offsetHeight||0)+(st?(parseFloat(st.marginBottom)||0):0);
}
function glueOf(b){
  var c=' '+(b.className||'')+' ';
  return c.indexOf(' sec-h ')>=0 || c.indexOf(' hd ')>=0 || c.indexOf(' doc-title ')>=0;
}
function layoutSheetsInner(){
  var host=$('formFill'); if(!host) return;
  var meas=$('a4Measure'), pagesHost=$('a4Pages');
  if(!meas||!pagesHost) return;

  // Fast path: blocks already sit on sheets whose content width equals the measuring column,
  // so measure them in place. If the page split is unchanged, touch nothing at all — moving
  // a node would collapse the caret while the user is typing.
  var laid=pagesHost.querySelectorAll('.a4-sheet > .doc');
  if(laid.length && _lastLayoutSig){
    var cur=[];
    Array.prototype.forEach.call(laid,function(d){
      Array.prototype.forEach.call(d.children,function(b){ cur.push(b); });
    });
    if(cur.length){
      var g0=a4ContentPx();
      var u0=groupUnits(cur.map(blockH), cur.map(glueOf));
      var p0=paginate(u0.map(function(u){return u.h;}), g0.h).map(function(ui){
        var o=[]; ui.forEach(function(k){ o=o.concat(u0[k].idx); }); return o;
      });
      if(p0.map(function(a){return a.join(',');}).join('|')+'#'+cur.length===_lastLayoutSig){
        meas.style.display='none';
        return false;
      }
    }
  }

  // pull every block back into the measuring column before measuring again
  var doc=meas.firstElementChild;
  if(!doc){
    doc=pagesHost.querySelector('.doc');
    if(!doc) return;
    meas.appendChild(doc);
  }
  Array.prototype.forEach.call(pagesHost.querySelectorAll('.a4-sheet > .doc'), function(d){
    while(d.firstChild) doc.appendChild(d.firstChild);
  });
  var g=a4ContentPx();
  meas.style.width=g.w+'px';

  meas.style.display='';
  var blocks=Array.prototype.slice.call(doc.children);
  var heights=blocks.map(blockH);
  var glue=blocks.map(glueOf);
  var units=groupUnits(heights, glue);
  var pages = paginate(units.map(function(u){return u.h;}), g.h).map(function(ui){
    var out=[]; ui.forEach(function(k){ out=out.concat(units[k].idx); }); return out;
  });

  _lastLayoutSig=sig;
  var docCls=doc.className;
  var out='';
  pages.forEach(function(_,pi){
    out+='<div class="a4-sheet" style="width:'+Math.round(210*MM)+'px;min-height:'+Math.round(297*MM)+'px;'+
         'padding:'+pageOpts.top+'mm '+pageOpts.side+'mm '+footBandMm()+'mm">'+
         '<div class="'+docCls+'"></div>'+
         '<div class="a4-foot-wrap" style="left:'+pageOpts.side+'mm;right:'+pageOpts.side+'mm;bottom:6mm;">'+footerHtml()+'</div>'+
         '<div class="a4-num">صفحة '+(pi+1)+' من '+pages.length+'</div></div>';
  });
  pagesHost.innerHTML=out;
  meas.style.display='none';           /* emptied after this pass: keep it out of the flow */
  var sheets=pagesHost.querySelectorAll('.a4-sheet');
  pages.forEach(function(idxs,pi){
    var tgt=sheets[pi].firstElementChild;
    idxs.forEach(function(i){
      var b=blocks[i]; if(!b) return;
      tgt.appendChild(b);
    });
  });
  var zoom=$('a4Zoom');
  var sheetW=Math.round(210*MM);
  var avail=host.clientWidth||0;
  if(avail<200) avail=sheetW+8;                 /* not measurable yet: don't scale */
  var sc=Math.min(1, Math.max(0.25, (avail-8)/sheetW));
  zoom.style.height='';                          /* reset BEFORE reading scrollHeight */
  zoom.style.transformOrigin='top center';
  zoom.style.transform = sc<1 ? 'scale('+sc+')' : '';
  if(sc<1){
    var nat=zoom.scrollHeight;
    if(nat>0) zoom.style.height=Math.ceil(nat*sc)+'px';
  }
}

var _layoutTimer=null;
function scheduleLayout(){

          var r=sel.getRangeAt(0);

        }
      }catch(e){}
    }
    var sc=document.querySelector('#formFill .a4-scroll');
    var top=sc?sc.scrollTop:0;
    var moved=layoutSheets();
    if(sc) sc.scrollTop=top;
    if(id && moved!==false){
      var el=$(id);

}
/* ── drag to resize table columns (edit view) ── */
function enableColResize(){
  document.querySelectorAll('#formFill table.doc-tbl').forEach(function(tbl){
    var firstRow=tbl.querySelector('tr'); if(!firstRow) return;
    // add a grip to each cell's left edge (except last) in the first row to drag column widths

var _cdrag=null;
function startColDrag(ev,cell,tbl){
  ev.preventDefault(); ev.stopPropagation();

function onColDrag(ev){

function endColDrag(){

    (diff===0 ? '<span class="inst-ok">مطابق</span>'

/* render a list of (already visible) fields into paired table rows; textarea + lone field span full width */
function renderFieldRows(fields, v){

    if(a.wide && a.type!=='textarea'){
      html+='<tr><td class="lbl">'+(v[a.id]?v[a.id].label:labelOf(a))+'</td><td colspan="3">'+((v[a.id]&&v[a.id].value)||'&nbsp;')+'</td></tr>';
      i++;
    } else if(a.type==='textarea'){
      var tv=(v[a.id]&&v[a.id].value)||'';

/* pure: glue a block to the one after it (mirrors page-break-after:avoid on .sec-h/.hd/.doc-title) */
function groupUnits(heights, glue){
  var units=[], i=0;
  while(i<heights.length){
    var idx=[i], h=heights[i]||0;
    if(glue && glue[i] && i+1<heights.length){ i++; idx.push(i); h+=(heights[i]||0); }
    units.push({idx:idx, h:h}); i++;
  }
  return units;
}
/* pure: distribute block heights onto pages — mirrors page-break-inside:avoid */
function paginate(heights, pageH){
  var pages=[], cur=[], used=0;
  for(var i=0;i<heights.length;i++){
    var h=heights[i]||0;
    if(cur.length && used+h>pageH){ pages.push(cur); cur=[]; used=0; }
    cur.push(i); used+=h;
  }
  if(cur.length) pages.push(cur);
  if(!pages.length) pages.push([]);
  return pages;
}

    var document=await archiveDoc(currentDocNo,v,'issued');
    var audit=await fetch('/api/app/forms/print',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({document_id:document.id})});
    if(!audit.ok)throw new Error('PRINT_NOT_ALLOWED');
    doPrint(docHtml()); pdfCount++;var cleared=await clearDraft(activeId);
    toast('تم إصدار المستند رقم '+currentDocNo+(cleared?'':'، لكن تعذر إزالة المسودة القديمة'));
  }catch(e){toast('تعذر حفظ المستند قبل الطباعة: '+(e.message||''));}
  finally{setDocumentActionBusy(false);}
}
async function submitForApproval(){
  if(documentActionBusy)return;
  if(currentPermissions.indexOf('forms.submit')<0){toast('ليست لديك صلاحية إرسال النموذج');return;}
  if(!validate())return;
  setDocumentActionBusy(true);
  try{
    currentDocNo=currentDocNo||await nextDocNoFromNeon();
    var saved=await archiveDoc(currentDocNo,vals(),'draft');
    var r=await fetch('/api/app/forms',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({action:'submit',document_id:saved.id})}),j=await r.json();
    if(!r.ok||!j.ok)throw new Error(j.error||'SUBMIT_FAILED');
    var cleared=await clearDraft(activeId);await loadRemoteArchive();
    toast((j.status==='pending_approval'?'تم إرسال النموذج للموافقات':'تم إرسال النموذج')+(cleared?'':'، لكن تعذر إزالة المسودة القديمة'));
  }catch(e){toast('تعذر إرسال النموذج: '+(e.message||''));}
  finally{setDocumentActionBusy(false);}
}
function printBlank(){
  // print an empty copy of the form (no data, no document number)
  var savedNo=currentDocNo;

function doPrint(inner, landscape){
  var frame=document.getElementById('printFrame');
  if(frame){ try{ frame.parentNode.removeChild(frame); }catch(e){} }
  frame=document.createElement('iframe'); frame.id='printFrame'; document.body.appendChild(frame);
  frame.style.position='fixed'; frame.style.left='-10000px'; frame.style.top='0';
  frame.style.border='0'; frame.style.background='#fff';
  if(landscape){ frame.style.width='1123px'; frame.style.height='794px'; }
  else { frame.style.width='794px'; frame.style.height='1123px'; }
  // Build the document title from the letter/form title so "Save as PDF" uses a clean name.
  var f=allForms.find(function(x){return x.id===activeId;});
  var docName=(docTitle||(f&&f.name)||'مستند').toString().replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim();
  // @page margin:0 removes the browser-injected header/footer (URL, title, date, time, page #).
  // Real page padding is applied to the body so content is framed correctly and flows across pages.
  var pageCss = landscape
    ? '@page{size:A4 landscape;margin:0;}html,body{margin:0;padding:0;background:#fff;}#pp-fit{width:1123px;height:794px;}*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}'
    : '@page{size:A4 portrait;margin:0;}html,body{margin:0;padding:0;background:#fff;}'+
      pageOptCss()+'.pp-sheet{width:100%;border-collapse:collapse;border:0;}'+'.pp-sheet>thead{display:table-header-group;}'+'.pp-sheet>tfoot{display:table-footer-group;}'+'.pp-sheet>thead>tr>td,.pp-sheet>tfoot>tr>td,.pp-sheet>tbody>tr>td{border:0;padding:0;background:none;vertical-align:top;text-align:right;font-size:initial;}'+'.pp-sheet,.pp-sheet>tbody,.pp-sheet>tbody>tr,.pp-sheet>tbody>tr>td{page-break-inside:auto;break-inside:auto;}'+
      '.doc{width:100%;}'+
      '.free-print{orphans:3;widows:3;}'+
      '.hd,.doc-title{page-break-after:avoid;break-after:avoid;}'+
      '*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}';
  var doc=frame.contentWindow.document;
  doc.open();
  doc.write('<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>'+docName+'</title><style>'+DOC_FONT_FACES+PRINT_CSS+'</style><style>'+pageCss+'</style></head><body><div class="pp-foot-fixed">'+footerHtml()+'</div><div id="pp-fit"><table class="pp-sheet"><thead><tr><td class="pp-top"></td></tr></thead><tfoot><tr><td class="pp-bot"></td></tr></tfoot><tbody><tr><td>'+inner+'</td></tr></tbody></table></div></body></html>');
  doc.close();
  // Fonts load from /fonts/forms, so wait for them before printing (capped so print never hangs).
  var printed=false;
  function go(){ if(printed)return; printed=true; try{ frame.contentWindow.focus(); frame.contentWindow.print(); }catch(e){} }
  var fontsReady=doc.fonts&&doc.fonts.ready;
  if(fontsReady){ fontsReady.then(function(){ setTimeout(go,150); }); }
  setTimeout(go, fontsReady?4000:450);
}
async function archiveDoc(docNo, v, status){
  var f=allForms.find(function(x){return x.id===activeId;});
  var arch=lsGet(archiveKey(),[]);
  var emp=(v.emp_name&&v.emp_name.value)||(v.pay_to&&v.pay_to.value)||'—';
  var archivedRecord={
    docNo:docNo, formId:activeId, formName:(docTitle||(f&&f.name)||''),
    dept:(docDept||(currentDept?currentDept.name:'')), emp:emp,
    editor:(currentUser?currentUser.name:''),
    ts:Date.now(), state:captureState()
  };
  var empRec=selectedFormEmployee||EMPLOYEES.find(function(x){return x.name===emp||String(x.id)===String((v.emp_no&&v.emp_no.value)||'');});
  var r=await fetch('/api/app/forms',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({form_type:String(activeId||'custom'),document_no:String(docNo),employee_id:empRec&&empRec.employee_id||null,status:status||'issued',payload:{state:captureState(),formId:activeId,formName:(docTitle||(f&&f.name)||''),dept:(docDept||(currentDept?currentDept.name:'')),employee:emp,editor:(currentUser?currentUser.name:'')}})}),j=await r.json();
  if(!r.ok||!j.ok)throw new Error(j.error||'SAVE_FAILED');
  arch=arch.filter(function(rec){return rec.docNo!==docNo;});
  arch.unshift(archivedRecord);
  if(arch.length>500) arch=arch.slice(0,500);
  lsSet(archiveKey(),arch);
  return j.document;
}
var archiveLoadVersion=0;
async function loadRemoteArchive(){
  var version=++archiveLoadVersion;
  try{
    if($('sec-archive')&&$('sec-archive').classList.contains('active')){$('archList').innerHTML='<div class="arch-empty">جارٍ تحميل المستندات...</div>';}
    var q=($('archSrch')?$('archSrch').value:'').trim();
    var responses=await Promise.all([
      fetch('/api/app/forms?type=__draft__&limit=100',{credentials:'same-origin',cache:'no-store'}),
      fetch('/api/app/forms?archive=1&page='+archivePage+'&limit=25&q='+encodeURIComponent(q),{credentials:'same-origin',cache:'no-store'})
    ]);
    if(!responses[0].ok||!responses[1].ok)throw new Error('ARCHIVE_LOAD_FAILED');
    var draftJson=await responses[0].json(),archiveJson=await responses[1].json();
    if(version!==archiveLoadVersion)return;
    if(!draftJson.ok||!archiveJson.ok)throw new Error('ARCHIVE_LOAD_FAILED');
    var draftDocs=draftJson.documents||[],drafts={};draftDocs.filter(function(d){return d.form_type==='__draft__'&&d.status==='draft';}).forEach(function(d){var p=d.payload||{};if(p.formId&&p.draft&&!Object.prototype.hasOwnProperty.call(drafts,p.formId))drafts[p.formId]=p.draft;});formMemory[draftKey()]=drafts;
    archiveTotal=Number(archiveJson.total||0);archiveTotalPages=Math.max(1,Number(archiveJson.totalPages||1));
    if(archivePage>archiveTotalPages){archivePage=archiveTotalPages;return loadRemoteArchive();}
    var docs=(archiveJson.documents||[]).map(function(d){var p=d.payload||{};return {id:d.id,status:d.status,docNo:d.document_no,formId:p.formId||d.form_type,formName:p.formName||d.form_type,dept:p.dept||d.department_name||'',emp:p.employee||d.employee_name||'—',editor:p.editor||d.creator_name||'',ts:new Date(d.created_at||d.updated_at||Date.now()).getTime(),state:p.state||{}};});
    lsSet(archiveKey(),docs);if(typeof renderArchive==='function')renderArchive();
  }catch(e){
    if(version!==archiveLoadVersion)return;
    var box=$('archList');
    if(box){
      box.innerHTML='<div class="arch-empty">تعذر تحميل المستندات. <button type="button" class="btn">إعادة المحاولة</button></div>';
      box.querySelector('button').onclick=loadRemoteArchive;
    }
  }
}
function openArchivedDoc(docNo){
  var arch=lsGet(archiveKey(),[]);
  var rec=arch.find(function(r){return r.docNo===docNo;});
  if(!rec) return;
  openForm(rec.formId);
  setTimeout(function(){ applyState(rec.state); currentDocNo=rec.docNo; toast('تم فتح المستند '+docNo); },50);
}

var builderFieldSeq=0;

  var box=$('nfFields');if(!box||!box.appendChild)return;builderFieldSeq++;
  var row=document.createElement('div');row.className='nf-builder-row';row.style.cssText='display:grid;grid-template-columns:1.1fr 1fr 1fr auto;gap:7px;align-items:center';

      ['text','نص'],['number','رقم'],['date','تاريخ'],['select','قائمة'],['textarea','نص طويل'],['employee_picker','اختيار موظف'],['department_picker','اختيار إدارة'],['branch_picker','اختيار فرع'],['signature','توقيع']
    ].map(function(x){return '<option value="'+x[0]+'" '+(x[0]===(type||'text')?'selected':'')+'>'+x[1]+'</option>';}).join('')+'</select>'+
    '<span style="display:flex;align-items:center;gap:6px;white-space:nowrap"><label style="font-size:.7rem"><input type="checkbox" class="nf-required"> إلزامي</label><button type="button" class="tb-btn" onclick="this.closest(\'.nf-builder-row\').remove()">حذف</button></span>'+
    '<select class="em-inp nf-binding" style="grid-column:1/-1;padding:0 8px"><option value="">بدون ربط تلقائي</option>'+[
      ['employee.full_name','اسم الموظف'],['employee.employee_number','الرقم الوظيفي'],['employee.department_name','الإدارة'],['employee.branch_name','الفرع'],['employee.job_title_name','المسمى الوظيفي'],['employee.manager_name','المدير المباشر'],['employee.phone','الجوال'],['employee.email','البريد الإلكتروني']
    ].map(function(x){return '<option value="'+x[0]+'" '+(x[0]===(binding||'')?'selected':'')+'>'+x[1]+'</option>';}).join('')+'</select>';
  box.appendChild(row);

function collectBuilderFields(){
  return Array.from(document.querySelectorAll('#nfFields .nf-builder-row')).map(function(row,index){
    var label=row.querySelector('.nf-label').value.trim(),key=row.querySelector('.nf-key').value.trim().replace(/[^a-zA-Z0-9_]/g,'_');
    return {type:row.querySelector('.nf-type').value,label:label||('حقل '+(index+1)),id:key||('field_'+(index+1)),req:row.querySelector('.nf-required').checked,employee_binding:row.querySelector('.nf-binding').value||undefined};
  });

function showAdd(){
  if(currentPermissions.indexOf('forms.manage_templates')<0){ toast('ليس لديك صلاحية إضافة نموذج'); return; }
  var fieldBox=$('nfFields');if(fieldBox&&(!fieldBox.children||!fieldBox.children.length)){addBuilderField('employee_picker','اسم الموظف','emp_name','employee.full_name');addBuilderField('date','التاريخ','date','');addBuilderField('textarea','التفاصيل','details','');}

async function addCustom(){
  var name=$('nfName').value.trim(), cat=$('nfCat').value,section=($('nfSection').value||'بيانات النموذج').trim(),fields=collectBuilderFields();
  if(!name){ toast('يرجى إدخال اسم النموذج'); return; }
  if(!fields.length)fields=[{type:'employee_picker',label:'اسم الموظف',id:'emp_name',req:true,employee_binding:'employee.full_name'},{type:'date',label:'التاريخ',id:'date',req:true},{type:'textarea',label:'التفاصيل',id:'details',req:false}];
  var f={id:'custom_'+Date.now(),name:name,cat:cat,icon:'custom',desc:'نموذج مخصص',sections:[{title:section,fields:fields}]};
  try{var r=await fetch('/api/app/forms',{method:'PUT',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({template_key:f.id,name:f.name,category:f.cat,icon:f.icon,description:f.desc,definition:f})});if(!r.ok)throw new Error('save_failed');}catch(e){toast('تعذر حفظ النموذج في قاعدة البيانات');return;}

function toast(msg){ var t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(window._tt); window._tt=setTimeout(function(){t.classList.remove('show');},2600); }

/* Load only the catalog permitted by the server. */
async function loadFormTemplates(){
  formCatalogState='loading';renderForms();
  try{
    var r=await fetch('/api/app/forms?templates=1',{credentials:'same-origin',cache:'no-store'}),j=await r.json();
    if(!r.ok||!j.ok)throw new Error('templates_unavailable');
    allForms=(j.templates||[]).map(function(t){var d=t.definition||{};return Object.assign({},d,{id:t.template_key,name:t.name,cat:t.category,icon:t.icon||d.icon,desc:t.description||d.desc});});

  }catch(e){ allForms=[];formCatalogState='error'; }

}

/* Load the shared security context before deriving per-user draft/archive keys.
   The server remains the authority; this is only UI state and never grants access. */
(async function initFormsSession(){
  try{
    var mr=await fetch('/api/app/auth/me',{credentials:'same-origin',cache:'no-store'});
    if(!mr.ok){ location.replace('/login'); return; }
    var mj=await mr.json();
    currentUser=mj.user||null;
    currentPermissions=Array.isArray(mj.permissions)?mj.permissions:[];
    currentScopes=Array.isArray(mj.scopes)?mj.scopes:[];
    currentRoles=Array.isArray(mj.roles)?mj.roles.map(function(r){return r.code;}):[];
    var addBtn=document.querySelector('[onclick="showAdd()"]');
    if(addBtn && currentPermissions.indexOf('forms.manage_templates')<0){ addBtn.disabled=true; addBtn.title='ليس لديك صلاحية إضافة نموذج'; addBtn.setAttribute('aria-disabled','true'); }
    var approvalsTab=$('approvalsTab');
    if(approvalsTab && currentPermissions.indexOf('forms.approve')<0 && currentPermissions.indexOf('forms.reject')<0)approvalsTab.style.display='none';
    var workflowsTab=$('workflowsTab');
    if(workflowsTab && currentPermissions.indexOf('forms.manage_workflows')<0)workflowsTab.style.display='none';
    var submitBtn=$('submitApprovalBtn');
    if(submitBtn && currentPermissions.indexOf('forms.submit')<0)submitBtn.style.display='none';
    if(currentPermissions.indexOf('forms.print')<0){var blankBtn=$('printBlankBtn'),pdfBtn=$('exportPdfBtn');if(blankBtn)blankBtn.style.display='none';if(pdfBtn)pdfBtn.style.display='none';}
    /* Employees are auxiliary data; never let a slow/failed picker request blank
       the catalogue. The catalogue is rendered as soon as its Neon request ends. */
    await loadFormTemplates();
    renderForms();
    loadEmployeesFromNeon().catch(function(){});
    loadFormLookups().catch(function(){});
    openRequestedFormsTask();
    await loadRemoteArchive();
  }catch(e){
    $('empGrid').textContent='تعذر تحميل النماذج. يرجى إعادة المحاولة.';
    toast('تعذر تحميل بعض بيانات النماذج');
  }
})();
